<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#grad)" />
  <!-- Circle Accent -->
  <circle cx="256" cy="256" r="190" fill="#3B82F6" opacity="0.4" filter="url(#shadow)" />
  <!-- Main P Badge -->
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Arial Black', sans-serif" font-size="240" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">P</text>
  <!-- Car & Text Indicator -->
  <rect x="136" y="380" width="240" height="54" rx="27" fill="#F59E0B" filter="url(#shadow)"/>
  <text x="256" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle">SMART PARKING 🚗</text>
</svg>
